[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpms"
version = "0.1.0"
description = "Free, open-source performance management: measures with approval, weekly team updates, tidy exports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "openpyxl>=3.1"]

[project.optional-dependencies]
server = ["gunicorn>=22"]

[project.scripts]
openpms = "openpms.cli:main"

[tool.setuptools.packages.find]
include = ["openpms*"]

[tool.setuptools.package-data]
openpms = ["templates/**/*.html", "static/*"]
